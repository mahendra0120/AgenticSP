    "pydantic-ai-slim>=2.42.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.46.0",
    "faiss-cpu>=1.9.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-huggingface>=0.3.0",
    "langchain-text-splitters>=1.0.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.12.1",
    "transformers>=5.1.0,<=5.5.0",
    "huggingface-hub>=1.20.1",
    "accelerate>=1.15.0",
